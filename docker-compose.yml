services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_gateway
      POSTGRES_PASSWORD: ai_gateway
      POSTGRES_DB: ai_gateway
    ports:
      - "5432:5432"
    volumes:
      - ai_gateway_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_gateway_postgres:
